AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Namazu co-selling agent access (default model): one shared
  Namazu-CoSell-Opportunity-Manager IAM role in this account that the Namazu
  co-selling agent assumes cross-account. Accountability is enforced per
  user: the role carries an AuthorizedUser tag, and the trust policy only
  accepts sessions presenting that exact sts:SourceIdentity — so every
  action the agent takes in your account is attributable to one named
  person in CloudTrail. Optional hardening: an ExternalId condition and a
  per-user RoleSessionName pin. For multiple named users with strictly
  separated roles, use per-user-roles.yaml instead.

Parameters:
  RoleName:
    Type: String
    Default: 'Namazu-CoSell-Opportunity-Manager'
    Description: >
      The role's name. The Namazu-CoSell-Opportunity-Manager prefix is
      fixed (it keeps the third-party access instantly identifiable in
      your IAM console, and the Namazu side gates its assumes to that
      namespace — a fully custom name would not be assumable); you may
      append a hyphenated suffix if the default name collides with an
      existing role or your conventions call for one (e.g.
      Namazu-CoSell-Opportunity-Manager-Prod). 64 characters total.
    AllowedPattern: '^Namazu-CoSell-Opportunity-Manager(-[A-Za-z0-9_+=,.@-]{1,30})?$'
  NamazuAccountId:
    Type: String
    Default: '308044622771'
    Description: >
      The AWS account ID of the Namazu hosting account to trust (the
      principal the agent assumes from). Your Namazu contact will confirm
      it; the default is Namazu Studios' production account.
    AllowedPattern: '^[0-9]{12}$'
  AuthorizedUser:
    Type: String
    Description: >
      The individual this role is attributed to (e.g. the account
      manager). Two things must match this value: the sts:SourceIdentity
      the agent presents when assuming the role, and this role's
      AuthorizedUser tag (set automatically below). Every action lands in
      CloudTrail under this identity. 2-64 characters (AWS requires
      source identities to be at least 2), letters, digits, and
      _+=,.@- only.
    AllowedPattern: '^[A-Za-z0-9_+=,.@-]{2,64}$'
  ExternalId:
    Type: String
    Default: ''
    Description: >
      Optional external ID for additional confused-deputy protection. When
      set, the trust policy additionally requires sts:ExternalId to match
      and the agent must be configured with the same value. At least 2
      characters when set (AWS requirement). Leave empty to rely on the
      SourceIdentity enforcement alone.
    AllowedPattern: '^$|^[A-Za-z0-9_+=,.@-]{2,1224}$'
  EnforceSessionName:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      When true, the trust policy additionally pins the assume-role
      session name to '<AuthorizedUser>-session' (the strict-accountability
      convention). The agent deployment must then use the matching session
      name. Leave false unless asked.
  ResourceScope:
    Type: String
    Default: '*'
    Description: >
      The Resource scope of the permission policy. Default '*' (all
      Partner Central resources the actions address — these actions have
      no finer resource types today). Override only if your compliance
      posture requires it; an unsupported value will cause AccessDenied.
  CatalogPin:
    Type: String
    Default: 'Sandbox'
    AllowedValues: ['Sandbox', 'AWS', 'Both']
    Description: >
      Which Partner Central catalog the agent may operate in, enforced by
      IAM via the partnercentral:Catalog condition key: 'Sandbox' (AWS's
      isolated test catalog — placeholder data, safe to trial against),
      'AWS' (the production catalog — real opportunities and engagement
      invitations), or 'Both' (grants both — use only when moving to
      production co-sell work; there is no unpinned/implicit option: an
      operator always chooses). The agent-side catalog hint should match;
      the IAM condition is what actually decides.
  BenefitsCatalogPin:
    Type: String
    Default: 'Sandbox'
    AllowedValues: ['Sandbox', 'AWS', 'Both']
    Description: >
      The same three-way choice, but for the Benefits (funding) API —
      kept SEPARATE from CatalogPin because funding applications are
      real-money asks: defaulting to Sandbox means enabling production
      selling never silently enables production funding. An operator who
      wants production funding sets this explicitly (usually alongside
      CatalogPin=AWS).
  EnableOutboundEngagement:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      The partner-initiated co-sell motions: create engagements and
      engagement invitations (bring AWS sellers onto partner-originated
      opportunities), the engagement<->opportunity task machinery
      (including the task that converts an accepted invitation into an
      opportunity), prospecting, and resource snapshots. Default false —
      the role stays receive-only until an operator opts in.
  EnableAllianceConnections:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      The Account API's partner-to-partner motions: connections and
      connection invitations (alliance-led co-sell with other partners),
      partner reads, and alliance-lead contact management. Default
      false — alliance programs are a distinct AWS program lane.
  AgentRoleArns:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Optional: exact IAM role ARNs allowed to assume this role. When
      Namazu's agent runs INSIDE this account (the internal-trial case —
      its pod identity is a per-workspace IRSA role here), list those
      roles so the trust no longer relies on the account-root principal:
      e.g.
      arn:aws:iam::<account>:role/bedrock-irsa-<workspace1>-us-east-1,arn:aws:iam::<account>:role/bedrock-irsa-<workspace2>-us-east-1.
      The sts:SourceIdentity condition still applies to every principal.
      Leave empty (the default) for the cross-account customer case,
      which trusts the account root.
  ManagedByTag:
    Type: String
    Default: 'namazu-apn-cloudformation'
    Description: >
      Value of the ManagedBy tag. When another component manages this
      role's lifecycle alongside the stack (the addon tags it with its
      own id), set this to the same value so drift detection doesn't
      flag a tag the other side re-applies.
    AllowedPattern: '^[A-Za-z0-9_.-]{1,128}$'
  WorkspaceIdTag:
    Type: String
    Default: ''
    Description: >
      Optional value for the cloud.namazustudios.com/workspace_id tag —
      the platform's cost/attribution tag, applied by the addon. Empty
      (the default) omits the tag (the external-customer case).
    AllowedPattern: '^$|^[a-f0-9]{24}$'
  OrganizationIdTag:
    Type: String
    Default: ''
    Description: >
      Optional value for the cloud.namazustudios.com/organization_id tag
      (the platform's organization attribution). Empty omits the tag.
    AllowedPattern: '^$|^[a-f0-9]{24}$'
  BillableTag:
    Type: String
    Default: ''
    AllowedValues: ['', 'true', 'false']
    Description: >
      Optional value for the cloud.namazustudios.com/billable tag. Empty
      omits the tag.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  HasSessionNamePin: !Equals [!Ref EnforceSessionName, 'true']
  IsCatalogBoth: !Equals [!Ref CatalogPin, 'Both']
  IsBenefitsCatalogBoth: !Equals [!Ref BenefitsCatalogPin, 'Both']
  IsOutboundEngagement: !Equals [!Ref EnableOutboundEngagement, 'true']
  IsAllianceConnections: !Equals [!Ref EnableAllianceConnections, 'true']
  HasAgentRoleArns: !Not [!Equals [!Join ['', !Ref AgentRoleArns], '']]
  HasWorkspaceIdTag: !Not [!Equals [!Ref WorkspaceIdTag, '']]
  HasOrganizationIdTag: !Not [!Equals [!Ref OrganizationIdTag, '']]
  HasBillableTag: !Not [!Equals [!Ref BillableTag, '']]

Resources:
  OpportunityManagerRole:
    Type: AWS::IAM::Role
    # Retain on delete: this role is the customer's identity anchor for
    # every co-selling session — deleting it would sever live access, and
    # import (the path that brings an already-deployed role under stack
    # management) requires an explicit DeletionPolicy.
    DeletionPolicy: Retain
    Properties:
      RoleName: !Ref RoleName
      Description: >-
        Assumed cross-account by the Namazu co-selling agent (with the
        AuthorizedUser source identity) to manage Partner Central
        co-selling opportunities. Created by namazu-apn-cloudformation.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CrossAccountIdentityEnforcement
            Effect: Allow
            Principal:
              # Internal-trial mode (AgentRoleArns set): trust exactly the
              # agent pods' IRSA roles — the agent runs in this account,
              # and a root-principal trust would let any principal in it
              # present the source identity. Customer mode (default): the
              # account root, as before.
              AWS: !If
                - HasAgentRoleArns
                - !Ref AgentRoleArns
                - !Sub 'arn:aws:iam::${NamazuAccountId}:root'
            Action:
              - sts:AssumeRole
              - sts:SetSourceIdentity
            Condition:
              # The assuming session must present this exact source
              # identity; it must equal the AuthorizedUser tag below —
              # that match is what makes every action attributable. The
              # optional ExternalId / RoleSessionName pins are folded in
              # via nested Fn::If (a Condition map can't carry two
              # Fn::If keys, so the presence/absence of each optional
              # condition selects one of the four literal maps).
              Fn::If:
                - HasExternalId
                - Fn::If:
                    - HasSessionNamePin
                    - StringEquals:
                        sts:SourceIdentity: !Ref AuthorizedUser
                        sts:ExternalId: !Ref ExternalId
                        sts:RoleSessionName: !Sub '${AuthorizedUser}-session'
                    - StringEquals:
                        sts:SourceIdentity: !Ref AuthorizedUser
                        sts:ExternalId: !Ref ExternalId
                - Fn::If:
                    - HasSessionNamePin
                    - StringEquals:
                        sts:SourceIdentity: !Ref AuthorizedUser
                        sts:RoleSessionName: !Sub '${AuthorizedUser}-session'
                    - StringEquals:
                        sts:SourceIdentity: !Ref AuthorizedUser
      Tags:
        - Key: AuthorizedUser
          Value: !Ref AuthorizedUser
        - Key: ManagedBy
          Value: !Ref ManagedByTag
        - !If
          - HasWorkspaceIdTag
          - Key: cloud.namazustudios.com/workspace_id
            Value: !Ref WorkspaceIdTag
          - !Ref 'AWS::NoValue'
        - !If
          - HasOrganizationIdTag
          - Key: cloud.namazustudios.com/organization_id
            Value: !Ref OrganizationIdTag
          - !Ref 'AWS::NoValue'
        - !If
          - HasBillableTag
          - Key: cloud.namazustudios.com/billable
            Value: !Ref BillableTag
          - !Ref 'AWS::NoValue'
      Policies:
        - PolicyName: PartnerCentralOpportunityManagement
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AllowPartnerCentralOpportunityManagement
                Effect: Allow
                Action:
                  # The agent's full command surface (verified against the
                  # AWS Service Authorization Reference; the IAM action
                  # prefix is partnercentral:, distinct from the
                  # partnercentral-selling CLI/SDK namespace).
                  - partnercentral:CreateOpportunity
                  - partnercentral:UpdateOpportunity
                  - partnercentral:SubmitOpportunity
                  - partnercentral:AssignOpportunity
                  - partnercentral:AssociateOpportunity
                  - partnercentral:DisassociateOpportunity
                  - partnercentral:GetOpportunity
                  - partnercentral:ListOpportunities
                  - partnercentral:ListEngagementInvitations
                  - partnercentral:GetEngagementInvitation
                  - partnercentral:AcceptEngagementInvitation
                  - partnercentral:RejectEngagementInvitation
                  - partnercentral:GetAwsOpportunitySummary
                  - partnercentral:ListSolutions
                  - partnercentral:TagResource
                  - partnercentral:UntagResource
                  - partnercentral:ListTagsForResource
                Resource: !Ref ResourceScope
                # 'Both' is the operator's explicit both-catalogs grant, so
                # no condition renders; either single choice renders the
                # matching partnercentral:Catalog pin. (An explicit three-
                # way toggle: an operator always chooses, there is no
                # implicit no-pin option.)
                Condition:
                  Fn::If:
                    - IsCatalogBoth
                    - !Ref AWS::NoValue
                    - StringEquals:
                        partnercentral:Catalog: !Ref CatalogPin
              # Funding (Benefits API) — governed by BenefitsCatalogPin,
              # deliberately not by CatalogPin: production funding is a
              # real-money ask and never silently inherits the selling
              # catalog choice. Action list verified against the botocore
              # service model (17/17 partnercentral-benefits operations —
              # AWS's published sandbox policy carries a three-s
              # Disasssociate typo and omits discovery/tagging actions).
              # Tagging rides the statement above. Opportunity read rides
              # the statement above (association re-validates it).
              - Sid: BenefitsManagement
                Effect: Allow
                Action:
                  - partnercentral:ListBenefits
                  - partnercentral:GetBenefit
                  - partnercentral:CreateBenefitApplication
                  - partnercentral:AmendBenefitApplication
                  - partnercentral:UpdateBenefitApplication
                  - partnercentral:SubmitBenefitApplication
                  - partnercentral:GetBenefitApplication
                  - partnercentral:CancelBenefitApplication
                  - partnercentral:RecallBenefitApplication
                  - partnercentral:ListBenefitApplications
                  - partnercentral:AssociateBenefitApplicationResource
                  - partnercentral:DisassociateBenefitApplicationResource
                  - partnercentral:ListBenefitAllocations
                  - partnercentral:GetBenefitAllocation
                Resource: !Ref ResourceScope
                Condition:
                  Fn::If:
                    - IsBenefitsCatalogBoth
                    - !Ref AWS::NoValue
                    - StringEquals:
                        partnercentral:Catalog: !Ref BenefitsCatalogPin
              # Benefit-application file attachments upload to AWS's
              # ephemeral write-only bucket (catalog-agnostic; the exact
              # bucket name from the live authz errors — the Developer
              # Guide's rendering drops a hyphen at a PDF line-wrap).
              - Sid: S3PutObjectAccess
                Effect: Allow
                Action: ["s3:PutObject"]
                Resource:
                  - arn:aws:s3:::aws-partner-central-marketplace-ephemeral-writeonly-files/*
              # Partner-initiated co-sell motions, gated by
              # EnableOutboundEngagement (statement omitted entirely when
              # false — the receive-only posture). Action names derived
              # from the CLI/botocore surface, PascalCase per the IAM
              # convention the Benefits grant verified.
              - Sid: OutboundEngagementMotions
                # Gated by the matching Enable* toggle: Allow when true, an explicit
                # Deny when false — fail-closed and visible in the policy
                # (AWS::NoValue statement-list elements are rejected inside
                # Fn::ForEach policies).
                Effect: !If
                  - IsOutboundEngagement
                  - Allow
                  - Deny
                Action:
                  - partnercentral:CreateEngagement
                  - partnercentral:GetEngagement
                  - partnercentral:ListEngagements
                  - partnercentral:ListEngagementMembers
                  - partnercentral:ListEngagementResourceAssociations
                  - partnercentral:CreateEngagementContext
                  - partnercentral:UpdateEngagementContext
                  - partnercentral:CreateEngagementInvitation
                  - partnercentral:StartEngagementByAcceptingInvitationTask
                  - partnercentral:ListEngagementByAcceptingInvitationTasks
                  - partnercentral:StartEngagementFromOpportunityTask
                  - partnercentral:ListEngagementFromOpportunityTasks
                  - partnercentral:StartOpportunityFromEngagementTask
                  - partnercentral:ListOpportunityFromEngagementTasks
                  - partnercentral:StartProspectingFromEngagementTask
                  - partnercentral:ListProspectingFromEngagementTasks
                  - partnercentral:GetProspectingFromEngagementTask
                  - partnercentral:CreateResourceSnapshot
                  - partnercentral:CreateResourceSnapshotJob
                  - partnercentral:GetResourceSnapshot
                  - partnercentral:ListResourceSnapshots
                  - partnercentral:GetResourceSnapshotJob
                  - partnercentral:ListResourceSnapshotJobs
                  - partnercentral:StartResourceSnapshotJob
                  - partnercentral:StopResourceSnapshotJob
                  - partnercentral:DeleteResourceSnapshotJob
                  - partnercentral:GetSellingSystemSettings
                Resource: !Ref ResourceScope
              - Sid: AllianceAndConnectionsMotions
                # Gated by EnableAllianceConnections (same Allow/Deny pattern).
                Effect: !If
                  - IsAllianceConnections
                  - Allow
                  - Deny
                Action:
                  - partnercentral:ListPartners
                  - partnercentral:GetPartner
                  - partnercentral:ListConnections
                  - partnercentral:GetConnection
                  - partnercentral:CreateConnectionInvitation
                  - partnercentral:CancelConnectionInvitation
                  - partnercentral:AcceptConnectionInvitation
                  - partnercentral:RejectConnectionInvitation
                  - partnercentral:ListConnectionInvitations
                  - partnercentral:GetConnectionInvitation
                  - partnercentral:CancelConnection
                  - partnercentral:GetConnectionPreferences
                  - partnercentral:UpdateConnectionPreferences
                  - partnercentral:GetAllianceLeadContact
                  - partnercentral:PutAllianceLeadContact
                  - partnercentral:GetProfileVisibility
                  - partnercentral:PutProfileVisibility
                  - partnercentral:GetVerification
                  - partnercentral:StartVerification
                Resource: !Ref ResourceScope

Outputs:
  RoleArn:
    Description: >
      The role the Namazu co-selling agent assumes. Give this to your
      Namazu contact (along with the ExternalId, if you set one) — it
      becomes the deployment's aws.roleArn.
    Value: !GetAtt OpportunityManagerRole.Arn
  AuthorizedUser:
    Description: >
      The source identity this role is attributed to — becomes the
      deployment's aws.sourceIdentity.
    Value: !Ref AuthorizedUser
  TemplateVersion:
    Description: Template revision for support reference.
    Value: '1.0.0'
