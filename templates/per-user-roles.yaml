AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Namazu co-selling agent access (strict-accountability variant): one
  Namazu-CoSell-Opportunity-Manager-<user> IAM role PER NAMED USER in this account,
  each individually trusted, individually tagged, and separately
  reviewable/revocable. Use this instead of opportunity-manager-role.yaml
  when multiple people work co-selling in this account and you want each
  one's access to be an independent role rather than a shared role keyed
  by a tag. Same trust model per role: the Namazu hosting account may
  assume it only with the matching per-user sts:SourceIdentity, so every
  action is attributable in CloudTrail. Optional ExternalId and
  per-user RoleSessionName pins apply to every role created.

Transform: AWS::LanguageExtensions

Parameters:
  RoleNamePrefix:
    Type: String
    Default: 'Namazu-CoSell-Opportunity-Manager'
    Description: >
      The prefix of the per-user role names (each role is
      <prefix>-<user>). The Namazu-CoSell-Opportunity-Manager prefix is
      fixed (it keeps the third-party access instantly identifiable in
      your IAM console, and the Namazu side gates its assumes to that
      namespace — a fully custom prefix would not be assumable); you may
      append a hyphenated suffix if the default collides with existing
      roles or your conventions call for one (e.g.
      Namazu-CoSell-Opportunity-Manager-Prod, yielding
      ...-Prod-<user> roles). At most 60 characters, to leave room for
      the per-user suffix within IAM's 64-character role-name cap.
    AllowedPattern: '^Namazu-CoSell-Opportunity-Manager(-[A-Za-z0-9_+=,.@-]{1,26})?$'
  NamazuAccountId:
    Type: String
    Default: '308044622771'
    Description: >
      The AWS account ID of the Namazu hosting account to trust (the
      principal the agent assumes from). Your Namazu contact will confirm
      it; the default is Namazu Studios' production account.
    AllowedPattern: '^[0-9]{12}$'
  Users:
    Type: CommaDelimitedList
    Description: >
      The individuals to create roles for (e.g. "peter,maria"). Each name
      becomes its own role (<RoleNamePrefix>-<name>), its AuthorizedUser
      tag, and the sts:SourceIdentity the agent must present for that
      role. Length bounds: at the default prefix each name may be up to
      30 characters (IAM's 64-character role-name cap minus the
      34-character prefix); a longer RoleNamePrefix shrinks that budget
      accordingly. AWS requires source identities to be at least 2
      characters. Letters, digits, and _+=,.@- only.
    AllowedPattern: '^[A-Za-z0-9_+=,.@-]{2,30}$'
  ExternalId:
    Type: String
    Default: ''
    Description: >
      Optional external ID for additional confused-deputy protection.
      When set, every role's trust policy additionally requires
      sts:ExternalId to match, and the agent deployment must be
      configured with the same value. At least 2 characters when set (AWS
      requirement).
    AllowedPattern: '^$|^[A-Za-z0-9_+=,.@-]{2,1224}$'
  EnforceSessionName:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      When true, each role's trust policy additionally pins the
      assume-role session name to '<user>-session' (the
      strict-accountability convention). Each agent deployment for that
      user must then use the matching session name.
  ResourceScope:
    Type: String
    Default: '*'
    Description: >
      The Resource scope of the permission policy. Default '*'. Override
      only if your compliance posture requires it; an unsupported value
      will cause AccessDenied.
  CatalogPin:
    Type: String
    Default: 'Sandbox'
    AllowedValues: ['Sandbox', 'AWS', 'Both']
    Description: >
      Which Partner Central catalog every role in this stack may operate
      in, enforced by IAM via the partnercentral:Catalog condition key:
      'Sandbox' (AWS's isolated test catalog — placeholder data, safe to
      trial against), 'AWS' (the production catalog — real opportunities
      and engagement invitations), or 'Both' (grants both — use only when
      moving to production co-sell work; there is no unpinned/implicit
      option: an operator always chooses). The agent-side catalog hint
      should match; the IAM condition is what actually decides.
  BenefitsCatalogPin:
    Type: String
    Default: 'Sandbox'
    AllowedValues: ['Sandbox', 'AWS', 'Both']
    Description: >
      The catalog choice for the Benefits (funding) API — separate from
      CatalogPin because funding applications are real-money asks:
      defaulting to Sandbox means enabling production selling never
      silently enables production funding. Every role in this stack
      carries this pin independently of the selling pin.
  EnableOutboundEngagement:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      The partner-initiated co-sell motions for every role in this
      stack: create engagements and engagement invitations (bring AWS
      sellers onto partner-originated opportunities), the
      engagement<->opportunity task machinery, prospecting, and resource
      snapshots. Default false — receive-only until an operator opts in.
  EnableAllianceConnections:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      The Account API's partner-to-partner motions for every role in
      this stack: connections and connection invitations (alliance-led
      co-sell with other partners), partner reads, and alliance-lead
      contact management. Default false.
  AgentRoleArns:
    Type: CommaDelimitedList
    Default: ''
    Description: >
      Optional: exact IAM role ARNs allowed to assume these roles — the
      Namazu agent's dedicated runner roles (one per agent workspace,
      cosell-runner-<namespace> in the hosting account). When set, the
      trust lists those principals instead of the account root; the
      sts:SourceIdentity condition (each role pinned to its person)
      still applies to every principal. Leave empty for the
      cross-account customer case with account-root trust.

Conditions:
  HasExternalId: !Not [!Equals [!Ref ExternalId, '']]
  HasSessionNamePin: !Equals [!Ref EnforceSessionName, 'true']
  IsCatalogBoth: !Equals [!Ref CatalogPin, 'Both']
  IsBenefitsCatalogBoth: !Equals [!Ref BenefitsCatalogPin, 'Both']
  IsOutboundEngagement: !Equals [!Ref EnableOutboundEngagement, 'true']
  IsAllianceConnections: !Equals [!Ref EnableAllianceConnections, 'true']
  HasAgentRoleArns: !Not [!Equals [!Join ['', !Ref AgentRoleArns], '']]

Resources:
  # Fn::ForEach is the direct key under Resources (LanguageExtensions):
  # each user in Users yields one AWS::IAM::Role whose logical id and
  # RoleName carry the user — one independently revocable role per
  # person, which is this template's whole point.
  Fn::ForEach::PerUserRole:
    - User
    - !Ref Users
    - 'NamazuCoSellOpportunityManagerRole${User}':
        Type: AWS::IAM::Role
        Properties:
          RoleName: !Sub '${RoleNamePrefix}-${User}'
          Description: !Sub >
            Assumed cross-account by the Namazu co-selling agent
            (source identity ${User}) to manage Partner Central
            co-selling opportunities. Created by
            namazu-apn-cloudformation.
          AssumeRolePolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CrossAccountIdentityEnforcement
                Effect: Allow
                Principal:
                  # AgentRoleArns set: exact runner principals (the
                  # internal-trial case); empty: the account root, as the
                  # cross-account customer case expects.
                  AWS: !If
                    - HasAgentRoleArns
                    - !Ref AgentRoleArns
                    - !Sub 'arn:aws:iam::${NamazuAccountId}:root'
                Action:
                  - sts:AssumeRole
                  - sts:SetSourceIdentity
                Condition:
                  # Same shape as opportunity-manager-role.yaml's trust
                  # condition, per user; nested Fn::If folds in the
                  # optional ExternalId / RoleSessionName pins (a
                  # Condition map can't carry two Fn::If keys).
                  Fn::If:
                    - HasExternalId
                    - Fn::If:
                        - HasSessionNamePin
                        - StringEquals:
                            sts:SourceIdentity: !Ref User
                            sts:ExternalId: !Ref ExternalId
                            sts:RoleSessionName: !Sub '${User}-session'
                        - StringEquals:
                            sts:SourceIdentity: !Ref User
                            sts:ExternalId: !Ref ExternalId
                    - Fn::If:
                        - HasSessionNamePin
                        - StringEquals:
                            sts:SourceIdentity: !Ref User
                            sts:RoleSessionName: !Sub '${User}-session'
                        - StringEquals:
                            sts:SourceIdentity: !Ref User
          Tags:
            - Key: AuthorizedUser
              Value: !Ref User
            - Key: ManagedBy
              Value: namazu-apn-cloudformation
            # Capability tags — the same parameters that render the
            # permission policy (never disagree), read by the agent to
            # self-discover what its deployment may do.
            - Key: cosell:catalog-selling
              Value: !Ref CatalogPin
            - Key: cosell:catalog-funding
              Value: !Ref BenefitsCatalogPin
            - Key: cosell:motion-outbound
              Value: !Ref EnableOutboundEngagement
            - Key: cosell:motion-alliance
              Value: !Ref EnableAllianceConnections
          Policies:
            - PolicyName: PartnerCentralOpportunityManagement
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Sid: AllowPartnerCentralOpportunityManagement
                    Effect: Allow
                    Action:
                      - partnercentral:CreateOpportunity
                      - partnercentral:UpdateOpportunity
                      - partnercentral:SubmitOpportunity
                      - partnercentral:AssignOpportunity
                      - partnercentral:AssociateOpportunity
                      - partnercentral:DisassociateOpportunity
                      - partnercentral:GetOpportunity
                      - partnercentral:ListOpportunities
                      - partnercentral:ListEngagementInvitations
                      - partnercentral:GetEngagementInvitation
                      - partnercentral:AcceptEngagementInvitation
                      - partnercentral:RejectEngagementInvitation
                      - partnercentral:GetAwsOpportunitySummary
                      - partnercentral:ListSolutions
                      - partnercentral:TagResource
                      - partnercentral:UntagResource
                      - partnercentral:ListTagsForResource
                    Resource: !Ref ResourceScope
                    # 'Both' is the operator's explicit both-catalogs
                    # grant (no condition renders); either single choice
                    # renders the matching partnercentral:Catalog pin.
                    Condition:
                      Fn::If:
                        - IsCatalogBoth
                        - !Ref AWS::NoValue
                        - StringEquals:
                            partnercentral:Catalog: !Ref CatalogPin
                  # Funding (Benefits API) — governed by
                  # BenefitsCatalogPin, deliberately separate from the
                  # selling pin (real-money asks). 17/17
                  # partnercentral-benefits operations minus the three
                  # tag actions, which ride the statement above.
                  - Sid: BenefitsManagement
                    Effect: Allow
                    Action:
                      - partnercentral:ListBenefits
                      - partnercentral:GetBenefit
                      - partnercentral:CreateBenefitApplication
                      - partnercentral:AmendBenefitApplication
                      - partnercentral:UpdateBenefitApplication
                      - partnercentral:SubmitBenefitApplication
                      - partnercentral:GetBenefitApplication
                      - partnercentral:CancelBenefitApplication
                      - partnercentral:RecallBenefitApplication
                      - partnercentral:ListBenefitApplications
                      - partnercentral:AssociateBenefitApplicationResource
                      - partnercentral:DisassociateBenefitApplicationResource
                      - partnercentral:ListBenefitAllocations
                      - partnercentral:GetBenefitAllocation
                    Resource: !Ref ResourceScope
                    Condition:
                      Fn::If:
                        - IsBenefitsCatalogBoth
                        - !Ref AWS::NoValue
                        - StringEquals:
                            partnercentral:Catalog: !Ref BenefitsCatalogPin
                  # Benefit-application attachments (AWS's ephemeral
                  # write-only bucket; catalog-agnostic).
                  - Sid: S3PutObjectAccess
                    Effect: Allow
                    Action: ["s3:PutObject"]
                    Resource:
                      - arn:aws:s3:::aws-partner-central-marketplace-ephemeral-writeonly-files/*
                  # Self-description: the role may read its OWN metadata and
                  # tags (nothing else) — the agent's capability discovery
                  # reads the cosell:* tags above. Scoped to this role's own
                  # ARN (<RoleNamePrefix>-<User>).
                  - Sid: ReadOwnRoleMetadata
                    Effect: Allow
                    Action: ["iam:GetRole", "iam:ListRoleTags"]
                    Resource:
                      - !Sub 'arn:aws:iam::${AWS::AccountId}:role/${RoleNamePrefix}-${User}'
                  # Partner-initiated co-sell motions, gated by
                  # EnableOutboundEngagement (omitted when false).
                  - Sid: OutboundEngagementMotions
                    # Gated by the matching Enable* toggle: Allow when true, an explicit
                    # Deny when false — fail-closed and visible in the policy
                    # (AWS::NoValue statement-list elements are rejected inside
                    # Fn::ForEach policies).
                    Effect: !If
                      - IsOutboundEngagement
                      - Allow
                      - Deny
                    Action:
                      - partnercentral:CreateEngagement
                      - partnercentral:GetEngagement
                      - partnercentral:ListEngagements
                      - partnercentral:ListEngagementMembers
                      - partnercentral:ListEngagementResourceAssociations
                      - partnercentral:CreateEngagementContext
                      - partnercentral:UpdateEngagementContext
                      - partnercentral:CreateEngagementInvitation
                      - partnercentral:StartEngagementByAcceptingInvitationTask
                      - partnercentral:ListEngagementByAcceptingInvitationTasks
                      - partnercentral:StartEngagementFromOpportunityTask
                      - partnercentral:ListEngagementFromOpportunityTasks
                      - partnercentral:StartOpportunityFromEngagementTask
                      - partnercentral:ListOpportunityFromEngagementTasks
                      - partnercentral:StartProspectingFromEngagementTask
                      - partnercentral:ListProspectingFromEngagementTasks
                      - partnercentral:GetProspectingFromEngagementTask
                      - partnercentral:CreateResourceSnapshot
                      - partnercentral:CreateResourceSnapshotJob
                      - partnercentral:GetResourceSnapshot
                      - partnercentral:ListResourceSnapshots
                      - partnercentral:GetResourceSnapshotJob
                      - partnercentral:ListResourceSnapshotJobs
                      - partnercentral:StartResourceSnapshotJob
                      - partnercentral:StopResourceSnapshotJob
                      - partnercentral:DeleteResourceSnapshotJob
                      - partnercentral:GetSellingSystemSettings
                    Resource: !Ref ResourceScope
                  - Sid: AllianceAndConnectionsMotions
                    # Gated by EnableAllianceConnections (same Allow/Deny pattern).
                    Effect: !If
                      - IsAllianceConnections
                      - Allow
                      - Deny
                    Action:
                      - partnercentral:ListPartners
                      - partnercentral:GetPartner
                      - partnercentral:ListConnections
                      - partnercentral:GetConnection
                      - partnercentral:CreateConnectionInvitation
                      - partnercentral:CancelConnectionInvitation
                      - partnercentral:AcceptConnectionInvitation
                      - partnercentral:RejectConnectionInvitation
                      - partnercentral:ListConnectionInvitations
                      - partnercentral:GetConnectionInvitation
                      - partnercentral:CancelConnection
                      - partnercentral:GetConnectionPreferences
                      - partnercentral:UpdateConnectionPreferences
                      - partnercentral:GetAllianceLeadContact
                      - partnercentral:PutAllianceLeadContact
                      - partnercentral:GetProfileVisibility
                      - partnercentral:PutProfileVisibility
                      - partnercentral:GetVerification
                      - partnercentral:StartVerification
                    Resource: !Ref ResourceScope

Outputs:
  # One output per user (ForEach directly under Outputs): each names the
  # role ARN that user's agent deployment assumes.
  Fn::ForEach::RoleArnOutputs:
    - User
    - !Ref Users
    - 'RoleArn${User}':
        Description: !Sub >
          The role the Namazu co-selling agent assumes for ${User}. Give
          it to your Namazu contact (along with the ExternalId, if you
          set one) — it becomes that user's deployment role, with
          ${User} as the source identity.
        Value: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${RoleNamePrefix}-${User}'
  TemplateVersion:
    Description: Template revision for support reference.
    Value: '1.0.0'
